{% extends "layout.html" %}
{% block content %}

<h2>Leaderboard</h2>

<table class="table table-striped">
<thead>
<tr>
<th>Rank</th>
<th>Username</th>
<th>Score</th>
</tr>
</thead>

<tbody>
{% for user in users %}
<tr>
<td>{{ loop.index }}</td>
<td>{{ user.username }}</td>
<td>{{ user.incoscore }}</td>
</tr>
{% endfor %}
</tbody>
</table>

{% endblock %}
